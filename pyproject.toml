[project]
name = "evidence-workbench"
version = "0.1.0"
description = "A bounded, evidence-first research workbench"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1",
  "langchain-core>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "httpx>=0.28,<1",
  "pypdf>=5,<7", "python-multipart>=0.0.20", "mcp>=1.12,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-timeout>=2,<3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/research/workbench"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires pgvector Postgres"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
