<title id="title">Evidence Workbench architecture</title>
<desc id="desc">The browser calls FastAPI through the Next.js proxy. Postgres queues research. An independent Python worker executes LangGraph, which uses hybrid retrieval and model adapters and persists checkpoints.</desc>
